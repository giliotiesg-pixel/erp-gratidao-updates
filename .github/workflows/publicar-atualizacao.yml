name: publicar-erp

on:
  push:
    branches:
      - main
    paths:
      - release-version.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: preparar
        shell: bash
        run: |
          V=$(head -n 1 release-version.txt | tr -d '\r\n ')
          sed -i -E "s/^const currentVersion = \"[^\"]+\"/const currentVersion = \"$V\"/" src/ARMAZEM_GRATIDAO_PRO.go
          python3 -c "from pathlib import Path; p=Path('src/ARMAZEM_GRATIDAO_PRO.go'); s=p.read_text(); old='func setMenuVisible(show bool) {\\n\\tmenuVisible = show\\n\\tcmd := uintptr(0)\\n\\tif show {\\n\\t\\tcmd = SW_SHOW\\n\\t}\\n\\tfor _, h := range navControls {\\n\\t\\tpShowWindow.Call(h, cmd)\\n\\t}\\n}'; new='func setMenuVisible(show bool) {\\n\\tmenuVisible = show\\n\\tnavCmd := uintptr(0)\\n\\tcontentCmd := uintptr(SW_SHOW)\\n\\tif show {\\n\\t\\tnavCmd = SW_SHOW\\n\\t\\tcontentCmd = 0\\n\\t}\\n\\tfor _, h := range content {\\n\\t\\tpShowWindow.Call(h, contentCmd)\\n\\t}\\n\\tfor _, h := range navControls {\\n\\t\\tpShowWindow.Call(h, navCmd)\\n\\t}\\n}'; s=s.replace(old,new); p.write_text(s)"
          grep -q 'contentCmd = 0' src/ARMAZEM_GRATIDAO_PRO.go
          echo "V=$V" >> "$GITHUB_ENV"
      - name: compilar
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "ARMAZEM_GRATIDAO_PRO_v${V}.exe" src/ARMAZEM_GRATIDAO_PRO.go
      - name: publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE="ARMAZEM_GRATIDAO_PRO_v${V}.exe"
          HASH=$(sha256sum "$EXE" | awk '{print $1}')
          echo "$HASH  $EXE" > SHA256.txt
          gh release delete "v${V}" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/v${V}" >/dev/null 2>&1 || true
          gh release create "v${V}" "$EXE" SHA256.txt --title "ARMAZEM GRATIDAO PRO v${V}" --notes "Correcao do menu lateral sem sobreposicao. Modulos 12.1.5 mantidos. Fiado preservado."
          printf '{\n  "version": "%s",\n  "package_url": "https://github.com/%s/releases/download/v%s/%s",\n  "sha256": "%s",\n  "notes": "ARMAZEM GRATIDAO PRO v%s - menu lateral sem sobreposicao; modulos 12.1.5 mantidos; Fiado preservado."\n}\n' "$V" "$GITHUB_REPOSITORY" "$V" "$EXE" "$HASH" "$V" > manifest.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/ARMAZEM_GRATIDAO_PRO.go manifest.json
          git commit -m "Publica v${V}" || true
          git push
