name: Publicar atualizacao ARMAZEM GRATIDAO PRO

on:
  push:
    branches: [main]
    paths:
      - 'release-version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Aplicar versao, migrar interface e organizar menu
        id: versao
        shell: bash
        run: |
          VERSION=$(head -n1 release-version.txt | tr -d '\r\n ')
          test -n "$VERSION"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/ARMAZEM_GRATIDAO_PRO.go')
          s=p.read_text()
          version=Path('release-version.txt').read_text().splitlines()[0].strip()
          s=re.sub(r'^const currentVersion = "[^"]+"', f'const currentVersion = "{version}"', s, count=1, flags=re.M)
          s=s.replace('Excluir venda selecionada','EXCLUIR VENDA')
          s=s.replace('comspec = `C:\\\\Windows\\\\System32\\\\cmd.exe`','comspec = `C:\\Windows\\System32\\cmd.exe`')

          marker='func showSimple(title, sub string) {'
          if 'func showFiscal()' not in s:
              block=r'''func showFiscal() { showSimple("Fiscal", "Central fiscal e dados tributários dos produtos") }
func showParceiros() { showSimple("Clientes / Fornecedores", "Cadastro e consulta de clientes e fornecedores") }
func showEmpresa() { showSimple("Empresa", "Dados da empresa e identificação do estabelecimento") }
func showContas() { showSimple("Contas", "Contas a pagar, saldos e movimentações financeiras") }
func showLucro() { showSimple("Lucro", "Margem, lucro bruto e dízimo sobre o lucro") }
func showRelatorios() { showSimple("Relatórios", "Vendas, estoque, caixa, lucro e fiado") }
func showOfertas() { showSimple("Ofertas", "Encarte, promoções e materiais de divulgação") }
func showCofre() { showSimple("Cofre Digital", "Cadastros protegidos de bancos, e-mails e acessos") }

'''
              s=s.replace(marker,block+marker,1)

          old='''\tcase strings.Contains(q, "compra"):\n\t\tshowSimple("Compras", "Entrada de compras, itens, fornecedor e valores")\n\tcase strings.Contains(q, "cliente") || strings.Contains(q, "fornecedor"):\n\t\tshowSimple("Clientes / Fornecedores", "Cadastros e consulta de parceiros")\n\tcase strings.Contains(q, "lucro"):\n\t\tshowSimple("Lucro", "Margem, lucro bruto e dízimo sobre o lucro")\n\tcase strings.Contains(q, "relat"):\n\t\tshowSimple("Relatórios", "Vendas, estoque, caixa, lucro e fiado")'''
          new='''\tcase strings.Contains(q, "compra"):\n\t\tshowSimple("Compras", "Entrada de compras, itens, fornecedor e valores")\n\tcase strings.Contains(q, "fiscal"):\n\t\tshowFiscal()\n\tcase strings.Contains(q, "cliente") || strings.Contains(q, "fornecedor"):\n\t\tshowParceiros()\n\tcase strings.Contains(q, "empresa"):\n\t\tshowEmpresa()\n\tcase strings.Contains(q, "conta"):\n\t\tshowContas()\n\tcase strings.Contains(q, "lucro"):\n\t\tshowLucro()\n\tcase strings.Contains(q, "relat"):\n\t\tshowRelatorios()\n\tcase strings.Contains(q, "oferta") || strings.Contains(q, "marketing") || strings.Contains(q, "encarte"):\n\t\tshowOfertas()\n\tcase strings.Contains(q, "cofre"):\n\t\tshowCofre()'''
          if old in s:
              s=s.replace(old,new,1)

          oldcases='''\tcase 110:\n\t\tshowSimple("Compras", "Entrada de compras, itens, fornecedor e valores")\n\tcase 111:\n\t\tshowSimple("Clientes / Fornecedores", "Cadastros e consulta de parceiros")\n\tcase 112:\n\t\tshowSimple("Lucro", "Margem, lucro bruto e dízimo sobre o lucro")\n\tcase 113:\n\t\tshowSimple("Relatórios", "Vendas, estoque, caixa, lucro e fiado")'''
          newcases='''\tcase 110:\n\t\tshowSimple("Compras", "Entrada de compras, itens, fornecedor e valores")\n\tcase 111:\n\t\tshowParceiros()\n\tcase 112:\n\t\tshowLucro()\n\tcase 113:\n\t\tshowRelatorios()\n\tcase 115:\n\t\tshowFiscal()\n\tcase 116:\n\t\tshowEmpresa()\n\tcase 117:\n\t\tshowContas()\n\tcase 118:\n\t\tshowOfertas()\n\tcase 119:\n\t\tshowCofre()'''
          if oldcases in s:
              s=s.replace(oldcases,newcases,1)
          s=s.replace('if id >= 101 && id <= 114 {','if id >= 101 && id <= 119 {')

          a=s.find('\t// Menu deslizante oculto, igual ao comportamento da referência.')
          if a < 0:
              a=s.find('\t// Menu completo migrado da referência 12.1.5.')
          b=s.find('\tsetMenuVisible(false)',a)
          if a!=-1 and b!=-1:
              b2=b+len('\tsetMenuVisible(false)')
              menu='''\t// Menu completo migrado da referência 12.1.5.\n\taddNavLabel("OPERAÇÃO", 58)\n\taddNav("Início", 101, 78)\n\taddNav("PDV", 102, 112)\n\taddNav("Vendas", 105, 146)\n\taddNav("Caixa", 108, 180)\n\taddNavLabel("CADASTROS / ESTOQUE", 218)\n\taddNav("Produtos", 103, 238)\n\taddNav("Estoque", 104, 272)\n\taddNav("Validade", 109, 306)\n\taddNav("Compras", 110, 340)\n\taddNav("Fiscal", 115, 374)\n\taddNav("Clientes / Fornecedores", 111, 408)\n\taddNav("Empresa", 116, 442)\n\taddNavLabel("FINANCEIRO", 480)\n\taddNav("Fiado", 106, 500)\n\taddNav("Contas", 117, 534)\n\taddNav("Lucro", 112, 568)\n\taddNavLabel("FERRAMENTAS", 606)\n\taddNav("Relatórios", 113, 626)\n\taddNav("Ofertas", 118, 660)\n\taddNav("Cofre Digital", 119, 694)\n\taddNav("Configurações", 114, 728)\n\tsetMenuVisible(false)'''
              s=s[:a]+menu+s[b2:]

          s=s.replace('205, 36, mainWnd, uintptr(id)', '205, 30, mainWnd, uintptr(id)')

          # Ao abrir o menu, oculta a area de trabalho para impedir textos/controles por cima do menu.
          # Ao fechar, restaura todos os controles da tela atual. O topbar permanece visivel.
          pat=r'''func setMenuVisible\(show bool\) \{.*?\n\}\nfunc toggleMenu\(\) \{ setMenuVisible\(!menuVisible\) \}'''
          repl='''func setMenuVisible(show bool) {
\tmenuVisible = show
\tnavCmd := uintptr(0)
\tcontentCmd := uintptr(SW_SHOW)
\tif show {
\t\tnavCmd = SW_SHOW
\t\tcontentCmd = 0
\t}
\tfor _, h := range content {
\t\tpShowWindow.Call(h, contentCmd)
\t}
\tfor _, h := range navControls {
\t\tpShowWindow.Call(h, navCmd)
\t}
}
func toggleMenu() { setMenuVisible(!menuVisible) }'''
          s,n=re.subn(pat,repl,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit('funcao setMenuVisible nao encontrada')

          s=re.sub(r'ws\("ARMAZEM GRATIDÃO PRO v[^"]+"\)', f'ws("ARMAZEM GRATIDÃO PRO v{version}")', s, count=1)
          p.write_text(s)
          PY
          grep -q 'func showFiscal()' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'addNav("Ofertas", 118' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'contentCmd = 0' src/ARMAZEM_GRATIDAO_PRO.go
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "exe=ARMAZEM_GRATIDAO_PRO_v$VERSION.exe" >> "$GITHUB_OUTPUT"
      - name: Compilar EXE Windows nativo
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "${{ steps.versao.outputs.exe }}" src/ARMAZEM_GRATIDAO_PRO.go
      - name: SHA256
        id: hash
        shell: bash
        run: |
          HASH=$(sha256sum "${{ steps.versao.outputs.exe }}" | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  ${{ steps.versao.outputs.exe }}" > SHA256.txt
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.versao.outputs.tag }}"
          EXE="${{ steps.versao.outputs.exe }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" SHA256.txt --clobber
          else
            gh release create "$TAG" "$EXE" SHA256.txt --title "ARMAZEM GRATIDAO PRO $TAG" --notes "Menu lateral organizado sem sobreposição de textos; módulos 12.1.5 mantidos e Fiado preservado."
          fi
      - name: Atualizar manifest e fonte
        shell: bash
        run: |
          VERSION="${{ steps.versao.outputs.version }}"
          TAG="${{ steps.versao.outputs.tag }}"
          EXE="${{ steps.versao.outputs.exe }}"
          HASH="${{ steps.hash.outputs.sha256 }}"
          printf '{\n  "version": "%s",\n  "package_url": "https://github.com/%s/releases/download/%s/%s",\n  "sha256": "%s",\n  "notes": "ARMAZEM GRATIDÃO PRO v%s - menu lateral organizado sem sobreposição; módulos 12.1.5 mantidos; Fiado preservado."\n}\n' "$VERSION" "$GITHUB_REPOSITORY" "$TAG" "$EXE" "$HASH" "$VERSION" > manifest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ARMAZEM_GRATIDAO_PRO.go manifest.json
          git commit -m "Publica ARMAZEM GRATIDAO PRO v${VERSION}" || true
          git push
