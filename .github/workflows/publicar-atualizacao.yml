name: publicar-erp
on:
  push:
    branches: [main]
    paths: [release-version.txt]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.x', cache: false}
      - name: preparar
        shell: bash
        run: |
          set -euo pipefail
          V=$(head -n 1 release-version.txt | tr -d '\r\n ')
          sed -i -E "s/^const currentVersion = \"[^\"]+\"/const currentVersion = \"$V\"/" src/ARMAZEM_GRATIDAO_PRO.go
          python3 tools/integrar_atualizador.py
          python3 tools/integrar_ui_12115.py
          python3 tools/auditar_migracao_12115.py
          grep -q 'handlePDV12115(id)' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'CORRIGIR ESTOQUE REAL' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showProdutosUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showComprasUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showVendasUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showEstoqueUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showCaixaUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showConsultaGlobal12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showFiadoUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showFinanceiroUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showFiscalUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showRelatoriosUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          grep -q showOfertasUI12115 src/ARMAZEM_GRATIDAO_PRO.go
          echo "V=$V" >> "$GITHUB_ENV"
      - name: compilar
        shell: bash
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "ARMAZEM_GRATIDAO_PRO_v${V}.exe" \
            src/ARMAZEM_GRATIDAO_PRO.go \
            src/MIGRACAO_PDV_INTERACAO_12115.go \
            src/MIGRACAO_COMPRAS_12115.go src/MIGRACAO_UI_COMPRAS_12115.go \
            src/MIGRACAO_ESTOQUE_12115.go src/MIGRACAO_UI_ESTOQUE_12115.go \
            src/MIGRACAO_VENDAS_12115.go src/MIGRACAO_UI_VENDAS_12115.go \
            src/MIGRACAO_FIADO_12115.go src/MIGRACAO_UI_FIADO_12115.go \
            src/MIGRACAO_PARCEIROS_FINANCEIRO_12115.go src/MIGRACAO_UI_FINANCEIRO_12115.go \
            src/MIGRACAO_RELATORIOS_12115.go src/MIGRACAO_UI_RELATORIOS_12115.go \
            src/MIGRACAO_CAIXA_PDV_12115.go src/MIGRACAO_UI_CAIXA_12115.go \
            src/MIGRACAO_FISCAL_EMPRESA_12115.go src/MIGRACAO_UI_FISCAL_EMPRESA_12115.go \
            src/MIGRACAO_OFERTAS_CONFIG_12115.go src/MIGRACAO_UI_OFERTAS_12115.go \
            src/MIGRACAO_DASHBOARD_12115.go \
            src/MIGRACAO_CONSULTA_PRODUTO_12115.go src/MIGRACAO_UI_CONSULTA_12115.go \
            src/MIGRACAO_COFRE_12115.go src/MIGRACAO_PRODUTOS_12115.go src/MIGRACAO_UI_PRODUTOS_12115.go \
            src/MIGRACAO_RECIBOS_12115.go src/MIGRACAO_AUDITORIA_12115.go
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o ATUALIZADOR_GRATIDAO.exe src/ATUALIZADOR_GRATIDAO.go
      - name: publicar
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          EXE="ARMAZEM_GRATIDAO_PRO_v${V}.exe"; UPD=ATUALIZADOR_GRATIDAO.exe; PKG="ERP_Gratidao_Update_v${V}.zip"; cp "$EXE" "ERP Gratidao.exe"; zip -9 "$PKG" "ERP Gratidao.exe"; unzip -t "$PKG"; PKGHASH=$(sha256sum "$PKG"|awk '{print $1}')
          HASH=$(sha256sum "$EXE"|awk '{print $1}'); UPDHASH=$(sha256sum "$UPD"|awk '{print $1}')
          echo "$HASH  $EXE" > SHA256.txt; echo "$UPDHASH  $UPD" >> SHA256.txt
          gh release delete "v${V}" --yes >/dev/null 2>&1 || true; git push origin ":refs/tags/v${V}" >/dev/null 2>&1 || true
          gh release create "v${V}" "$EXE" "$UPD" "$PKG" SHA256.txt --title "ARMAZEM GRATIDAO PRO v${V}" --notes "Migracao funcional nativa da referencia 12.1.15."
          printf '{\n"version":"%s",\n"package_url":"https://github.com/%s/releases/download/v%s/%s",\n"sha256":"%s",\n"updater_url":"https://github.com/%s/releases/download/v%s/%s",\n"updater_sha256":"%s",\n"notes":"Migracao 12.1.15; dados preservados."\n}\n' "$V" "$GITHUB_REPOSITORY" "$V" "$EXE" "$HASH" "$GITHUB_REPOSITORY" "$V" "$UPD" "$UPDHASH" > manifest.json
          mkdir -p erp; printf '{\n"version":"%s",\n"package_url":"https://github.com/%s/releases/download/v%s/%s",\n"sha256":"%s",\n"notes":"ERP Gratidao v%s - pacote ZIP validado."\n}\n' "$V" "$GITHUB_REPOSITORY" "$V" "$PKG" "$PKGHASH" "$V" > erp/versao.json; python3 -m json.tool erp/versao.json >/dev/null; git config user.name github-actions; git config user.email github-actions@github.com
          git add src/ARMAZEM_GRATIDAO_PRO.go manifest.json erp/versao.json; git commit -m "Publica v${V}" || true; git push
