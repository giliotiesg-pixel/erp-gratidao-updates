name: Publicar atualizacao ARMAZEM GRATIDAO PRO

on:
  push:
    branches: [main]
    paths:
      - 'src/v1.2.17.patch'
      - '.github/workflows/publicar-atualizacao.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-atualizacao
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Reconstruir fonte nativo v1.2.17
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/base.zip 'https://github.com/giliotiesg-pixel/erp-gratidao-updates/releases/download/v1.2.11/ERP_Gratidao_v1.2.11_Limpar_Vendas_Excluidas.zip'
          unzip -j /tmp/base.zip 'CODIGO_FONTE_native_v1.2.11.go' -d /tmp
          cp /tmp/CODIGO_FONTE_native_v1.2.11.go /tmp/oldfmt.go
          gofmt -w /tmp/oldfmt.go
          patch /tmp/oldfmt.go < src/v1.2.17.patch
          cp /tmp/oldfmt.go src/ARMAZEM_GRATIDAO_PRO.go
          gofmt -w src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'const currentVersion = "1.2.17"' src/ARMAZEM_GRATIDAO_PRO.go

      - name: Ler versao do codigo
        id: versao
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const currentVersion = "\([^"]*\)"/\1/p' src/ARMAZEM_GRATIDAO_PRO.go | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "exe=ARMAZEM_GRATIDAO_PRO_v$VERSION.exe" >> "$GITHUB_OUTPUT"

      - name: Compilar EXE Windows nativo
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "${{ steps.versao.outputs.exe }}" src/ARMAZEM_GRATIDAO_PRO.go

      - name: Calcular SHA256
        id: hash
        shell: bash
        run: |
          HASH=$(sha256sum "${{ steps.versao.outputs.exe }}" | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH  ${{ steps.versao.outputs.exe }}" > SHA256.txt

      - name: Criar ou atualizar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.versao.outputs.tag }}"
          EXE="${{ steps.versao.outputs.exe }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" SHA256.txt --clobber
          else
            gh release create "$TAG" "$EXE" SHA256.txt --title "ARMAZEM GRATIDAO PRO $TAG" --notes "Atualizacao automatica do ARMAZEM GRATIDAO PRO $TAG."
          fi

      - name: Atualizar manifest
        shell: bash
        run: |
          VERSION="${{ steps.versao.outputs.version }}"
          TAG="${{ steps.versao.outputs.tag }}"
          EXE="${{ steps.versao.outputs.exe }}"
          HASH="${{ steps.hash.outputs.sha256 }}"
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "package_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$EXE",
            "sha256": "$HASH",
            "notes": "ARMAZEM GRATIDÃO PRO v$VERSION publicado automaticamente."
          }
          EOF

      - name: Preservar fonte e manifest no repositorio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ARMAZEM_GRATIDAO_PRO.go manifest.json
          if git diff --cached --quiet; then
            echo 'Fonte e manifest ja estao atualizados.'
          else
            git commit -m "Publica fonte e canal v${{ steps.versao.outputs.version }}"
            git push
          fi
