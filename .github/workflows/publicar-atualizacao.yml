name: publicar-erp

on:
  push:
    branches:
      - main
    paths:
      - release-version.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: preparar
        shell: bash
        run: |
          V=$(head -n 1 release-version.txt | tr -d '\r\n ')
          sed -i -E "s/^const currentVersion = \"[^\"]+\"/const currentVersion = \"$V\"/" src/ARMAZEM_GRATIDAO_PRO.go
          python3 tools/integrar_atualizador.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ARMAZEM_GRATIDAO_PRO.go')
          s=p.read_text()
          old='''func header(title, sub string) {\n\th := add("STATIC", title, 0, 18, 67, 650, 35, 0)\n\tpSendMessageW.Call(h, WM_SETFONT, fontBig, 1)\n\tadd("STATIC", sub, 0, 18, 99, 1215, 22, 0)\n}'''
          new='''func header(title, sub string) {\n\t// Cabeçalho limpo: somente o nome do módulo, centralizado na caixa principal.\n\th := add("STATIC", title, 0x00000001, 18, 67, 1215, 42, 0)\n\tpSendMessageW.Call(h, WM_SETFONT, fontBig, 1)\n}'''
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif 'Cabeçalho limpo' not in s:
              raise SystemExit('ERRO: funcao header esperada nao encontrada')
          PY
          python3 tools/auditar_migracao_12115.py
          grep -q 'UpdaterURL' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'ATUALIZADOR_GRATIDAO.exe' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'Cabeçalho limpo' src/ARMAZEM_GRATIDAO_PRO.go
          grep -q 'contentCmd = 0' src/ARMAZEM_GRATIDAO_PRO.go
          if grep -q 'instalar-.*\.bat' src/ARMAZEM_GRATIDAO_PRO.go; then echo 'ERRO: fluxo BAT antigo ainda presente'; exit 1; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: compilar
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "ARMAZEM_GRATIDAO_PRO_v${V}.exe" src/ARMAZEM_GRATIDAO_PRO.go
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o "ATUALIZADOR_GRATIDAO.exe" src/ATUALIZADOR_GRATIDAO.go
      - name: publicar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE="ARMAZEM_GRATIDAO_PRO_v${V}.exe"
          UPD="ATUALIZADOR_GRATIDAO.exe"
          HASH=$(sha256sum "$EXE" | awk '{print $1}')
          UPDHASH=$(sha256sum "$UPD" | awk '{print $1}')
          echo "$HASH  $EXE" > SHA256.txt
          echo "$UPDHASH  $UPD" >> SHA256.txt
          gh release delete "v${V}" --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/v${V}" >/dev/null 2>&1 || true
          gh release create "v${V}" "$EXE" "$UPD" SHA256.txt --title "ARMAZEM GRATIDAO PRO v${V}" --notes "Migracao funcional da referencia 12.1.15 em andamento; auditoria automatica de modulos; banco e dados preservados."
          printf '{\n  "version": "%s",\n  "package_url": "https://github.com/%s/releases/download/v%s/%s",\n  "sha256": "%s",\n  "updater_url": "https://github.com/%s/releases/download/v%s/%s",\n  "updater_sha256": "%s",\n  "notes": "ARMAZEM GRATIDAO PRO v%s - migracao funcional 12.1.15; auditoria de modulos; dados preservados."\n}\n' "$V" "$GITHUB_REPOSITORY" "$V" "$EXE" "$HASH" "$GITHUB_REPOSITORY" "$V" "$UPD" "$UPDHASH" "$V" > manifest.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/ARMAZEM_GRATIDAO_PRO.go manifest.json
          git commit -m "Publica v${V}" || true
          git push
