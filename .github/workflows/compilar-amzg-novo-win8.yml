name: Compilar Armazem Gratidao Novo Windows 8
on:
  push:
    paths:
      - 'novo-win8/**'
      - '.github/workflows/compilar-amzg-novo-win8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restaurar SQLite
        shell: pwsh
        run: nuget install System.Data.SQLite.Core -Version 1.0.118 -OutputDirectory novo-win8/packages -NonInteractive -DependencyVersion Highest
      - name: Restaurar leitor de codigo de barras
        shell: pwsh
        run: nuget install ZXing.Net -Version 0.16.9 -OutputDirectory novo-win8/packages -NonInteractive
      - name: Ajustar referencia do leitor de codigos
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages/ZXing.Net.0.16.9 -Recurse -Filter zxing.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { throw "Biblioteca zxing.dll não encontrada" }
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m","http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='zxing']/m:HintPath",$ns)
          if (!$ref) { throw "Referencia ZXing ausente" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Restaurar biblioteca QR Code
        shell: pwsh
        run: nuget install QRCoder -Version 1.4.3 -OutputDirectory novo-win8/packages -NonInteractive
      - name: Ajustar referencia QR Code para o caminho real do pacote
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages/QRCoder.1.4.3 -Recurse -Filter QRCoder.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { throw "Biblioteca QRCoder.dll nao encontrada" }
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m","http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='QRCoder']/m:HintPath",$ns)
          if (!$ref) { throw "Referencia QR ausente do projeto" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Ajustar referencia SQLite para o caminho real do pacote
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages -Recurse -Filter System.Data.SQLite.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { Get-ChildItem novo-win8/packages -Recurse -File | Select-Object -ExpandProperty FullName; throw "System.Data.SQLite.dll nao encontrado apos instalacao das dependencias" }
          Write-Host "DLL encontrada: $($dll.FullName)"
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m", "http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='System.Data.SQLite']/m:HintPath", $ns)
          if (!$ref) { throw "Referencia SQLite ausente no projeto" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Gravar versao real da compilacao no executavel
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}.0"
          $assembly = "using System.Reflection;`n[assembly: AssemblyVersion(`"$version`")]`n[assembly: AssemblyFileVersion(`"$version`")]`n"
          Set-Content -Path novo-win8/BuildVersion.cs -Value $assembly -Encoding UTF8
      - name: Compilar WinForms .NET Framework 4.8
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" novo-win8/ArmazemGratidao.csproj /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\x64\Release\ /v:minimal
      - name: Copiar SQLite nativo
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages -Recurse -Filter SQLite.Interop.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (!$dll) { throw "SQLite.Interop.dll x64 nao encontrado" }
          New-Item -ItemType Directory -Force novo-win8/bin/x64/Release/x64 | Out-Null
          Copy-Item $dll.FullName novo-win8/bin/x64/Release/x64/SQLite.Interop.dll
      - name: Testar backup automatico antes do instalador
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "teste-backup-amzg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "novo-win8/bin/x64/Release/System.Data.SQLite.dll" $dir
          Copy-Item "novo-win8/bin/x64/Release/x64/SQLite.Interop.dll" $dir
          Copy-Item "novo-win8/backup-antes-instalacao.ps1" $dir
          $db = Join-Path $dir "armazem-gratidao.db"
          Add-Type -Path (Join-Path $dir "System.Data.SQLite.dll")
          $source = New-Object System.Data.SQLite.SQLiteConnection("Data Source=$db")
          try {
            $source.Open()
            $command = $source.CreateCommand()
            $command.CommandText = "CREATE TABLE products(id INTEGER PRIMARY KEY,name TEXT); INSERT INTO products(name) VALUES('TESTE PROTECAO');"
            $command.ExecuteNonQuery() | Out-Null
            $command.Dispose()
          } finally {
            $source.Dispose()
          }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $dir "backup-antes-instalacao.ps1") -Database $db -TargetDirectory $dir
          if ($LASTEXITCODE -ne 0) { throw "O backup previo da instalacao falhou" }
          $copies = @(Get-ChildItem -Path $dir -Filter "armazem-gratidao-antes-atualizacao-*.db")
          if ($copies.Count -ne 1 -or $copies[0].Length -le 0) { throw "Backup nao encontrado ou vazio" }
          $test = New-Object System.Data.SQLite.SQLiteConnection("Data Source=$($copies[0].FullName);Read Only=True;FailIfMissing=True")
          try {
            $test.Open()
            $check = $test.CreateCommand()
            $check.CommandText = "SELECT name FROM products WHERE id=1"
            if ($check.ExecuteScalar() -ne "TESTE PROTECAO") { throw "O backup nao preservou os dados" }
            $check.Dispose()
          } finally { $test.Dispose() }
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Gerar Setup EXE
        shell: pwsh
        working-directory: novo-win8
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup nao encontrado" }
          & $iscc instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Armazem-Gratidao-Novo-Windows8-Setup
          path: novo-win8/installer/*.exe
          if-no-files-found: error
      - name: Publicar instalador EXE no Releases
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem "novo-win8/installer" -Filter *.exe -File)
          if ($files.Count -eq 0) { throw "Nenhum instalador EXE foi gerado" }
          $tag = "amzg-novo-win8-build-${{ github.run_number }}"
          $paths = @($files | ForEach-Object { $_.FullName })
          gh release create $tag @paths --title "Armazem Gratidao Novo - compilacao ${{ github.run_number }}" --notes "Instalador Windows x64 gerado automaticamente. O instalador executa backup SQLite automatico antes de atualizar e bloqueia a instalacao se a copia nao for validada. Os dados de vendas, produtos, estoque e fiado sao preservados." --target "${{ github.sha }}" --latest
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o instalador no Releases" }
