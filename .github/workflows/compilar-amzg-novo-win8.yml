name: Compilar Armazem Gratidao Novo Windows 8
on:
  push:
    paths:
      - 'novo-win8/**'
      - '.github/workflows/compilar-amzg-novo-win8.yml'
  workflow_dispatch:
permissions:
  contents: write
# Manter somente a compilacao mais recente por ramificacao.
# Em main, nao cancelar uma publicacao em andamento.
concurrency:
  group: amzg-novo-win8-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NuGet
        uses: NuGet/setup-nuget@v2
      - name: Restaurar SQLite
        shell: pwsh
        run: nuget install System.Data.SQLite.Core -Version 1.0.118 -OutputDirectory novo-win8/packages -NonInteractive -DependencyVersion Highest
      - name: Restaurar leitor de codigo de barras
        shell: pwsh
        run: nuget install ZXing.Net -Version 0.16.9 -OutputDirectory novo-win8/packages -NonInteractive
      - name: Ajustar referencia do leitor de codigos
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages/ZXing.Net.0.16.9 -Recurse -Filter zxing.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { throw "Biblioteca zxing.dll não encontrada" }
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m","http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='zxing']/m:HintPath",$ns)
          if (!$ref) { throw "Referencia ZXing ausente" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Restaurar biblioteca QR Code
        shell: pwsh
        run: nuget install QRCoder -Version 1.4.3 -OutputDirectory novo-win8/packages -NonInteractive
      - name: Ajustar referencia QR Code para o caminho real do pacote
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages/QRCoder.1.4.3 -Recurse -Filter QRCoder.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { throw "Biblioteca QRCoder.dll nao encontrada" }
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m","http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='QRCoder']/m:HintPath",$ns)
          if (!$ref) { throw "Referencia QR ausente do projeto" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Ajustar referencia SQLite para o caminho real do pacote
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages -Recurse -Filter System.Data.SQLite.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if (!$dll) { Get-ChildItem novo-win8/packages -Recurse -File | Select-Object -ExpandProperty FullName; throw "System.Data.SQLite.dll nao encontrado apos instalacao das dependencias" }
          Write-Host "DLL encontrada: $($dll.FullName)"
          $proj = "novo-win8/ArmazemGratidao.csproj"
          [xml]$xml = Get-Content $proj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("m", "http://schemas.microsoft.com/developer/msbuild/2003")
          $ref = $xml.SelectSingleNode("//m:Reference[@Include='System.Data.SQLite']/m:HintPath", $ns)
          if (!$ref) { throw "Referencia SQLite ausente no projeto" }
          $ref.InnerText = $dll.FullName
          $xml.Save((Resolve-Path $proj).Path)
      - name: Gerar icone nativo do aplicativo e instalador
        shell: pwsh
        run: |
          & "novo-win8/gerar-icone.ps1"
          if (!(Test-Path "novo-win8/Armazem-Gratidao.ico")) { throw "Icone Windows nao foi gerado" }
          if ((Get-Item "novo-win8/Armazem-Gratidao.ico").Length -lt 1000) { throw "Icone invalido" }
      - name: Gravar versao real da compilacao no executavel
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}.0"
          $assembly = "using System.Reflection;`n[assembly: AssemblyVersion(`"$version`")]`n[assembly: AssemblyFileVersion(`"$version`")]`n"
          Set-Content -Path novo-win8/BuildVersion.cs -Value $assembly -Encoding UTF8
      - name: Validar rotinas criticas antes da compilacao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = Get-Content 'novo-win8/ProdutosForm.cs' -Raw
          $pdv = Get-Content 'novo-win8/PdvForm.cs' -Raw
          $sales = Get-Content 'novo-win8/ConsultaForm.cs' -Raw
          $required = @(
            @{ Label = 'Entradas de estoque'; Text = $product; Pattern = 'void AddQuantityForProduct\(' },
            @{ Label = 'Auditoria de estoque'; Text = $product; Pattern = 'INSERT INTO stock_audit_log' },
            @{ Label = 'Restauracao da protecao de estoque'; Text = $product; Pattern = 'UPDATE runtime_operation_context SET authorized=@auth,operation=@operation' },
            @{ Label = 'Preco do carrinho'; Text = $pdv; Pattern = 'void UpdateRegisteredPrice\(' },
            @{ Label = 'Pagamentos divididos'; Text = $pdv; Pattern = 'SelectSplitPayments\(' },
            @{ Label = 'Descontos'; Text = $pdv; Pattern = 'void ConfigureDiscount\(' },
            @{ Label = 'Atualizacao das vendas'; Text = $sales; Pattern = 'RefreshAfterRecordedSale\(' }
          )
          foreach ($check in $required) {
            if ($check.Text -notmatch $check.Pattern) { throw "Rotina critica ausente: $($check.Label)" }
          }
          Write-Host 'Rotinas criticas presentes. Compilacao obrigatoria na proxima etapa.'
      - name: Compilar WinForms .NET Framework 4.8
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" novo-win8/ArmazemGratidao.csproj /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\x64\Release\ /v:minimal /fl "/flp:logfile=novo-win8/build-diagnostics.log;verbosity=normal"
      - name: Compilar atualizador independente do instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" novo-win8/AtualizadorGratidao.csproj /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\x64\Release\ /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Falha na compilacao do atualizador visual" }
          if (!(Test-Path "novo-win8/bin/x64/Release/AtualizadorGratidao.exe")) { throw "Executavel do atualizador ausente" }
      - name: Guardar diagnostico de compilacao quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostico-Compilacao-AMZG
          path: novo-win8/build-diagnostics.log
          if-no-files-found: warn
      - name: Copiar SQLite nativo
        shell: pwsh
        run: |
          $dll = Get-ChildItem novo-win8/packages -Recurse -Filter SQLite.Interop.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (!$dll) { throw "SQLite.Interop.dll x64 nao encontrado" }
          New-Item -ItemType Directory -Force novo-win8/bin/x64/Release/x64 | Out-Null
          Copy-Item $dll.FullName novo-win8/bin/x64/Release/x64/SQLite.Interop.dll
      - name: Testar backup automatico antes do instalador
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "teste-backup-amzg"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "novo-win8/bin/x64/Release/System.Data.SQLite.dll" $dir
          Copy-Item "novo-win8/bin/x64/Release/x64/SQLite.Interop.dll" $dir
          Copy-Item "novo-win8/backup-antes-instalacao.ps1" $dir
          $db = Join-Path $dir "armazem-gratidao.db"
          Add-Type -Path (Join-Path $dir "System.Data.SQLite.dll")
          $source = New-Object System.Data.SQLite.SQLiteConnection("Data Source=$db")
          try {
            $source.Open()
            $command = $source.CreateCommand()
            $command.CommandText = "CREATE TABLE products(id INTEGER PRIMARY KEY,name TEXT); INSERT INTO products(name) VALUES('TESTE PROTECAO');"
            $command.ExecuteNonQuery() | Out-Null
            $command.Dispose()
          } finally {
            $source.Dispose()
          }
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $dir "backup-antes-instalacao.ps1") -Database $db -TargetDirectory $dir
          if ($LASTEXITCODE -ne 0) { throw "O backup previo da instalacao falhou" }
          $copies = @(Get-ChildItem -Path $dir -Filter "armazem-gratidao-antes-atualizacao-*.db")
          if ($copies.Count -ne 1 -or $copies[0].Length -le 0) { throw "Backup nao encontrado ou vazio" }
          $test = New-Object System.Data.SQLite.SQLiteConnection("Data Source=$($copies[0].FullName);Read Only=True;FailIfMissing=True")
          try {
            $test.Open()
            $check = $test.CreateCommand()
            $check.CommandText = "SELECT name FROM products WHERE id=1"
            if ($check.ExecuteScalar() -ne "TESTE PROTECAO") { throw "O backup nao preservou os dados" }
            $check.Dispose()
          } finally { $test.Dispose() }
      # ATUALIZACAO CONTINUA: gera ZIP, NUNCA outro instalador.
      # O instalador completo fica publicado uma unica vez em release legado.
      - name: Conferir backup integral
        shell: pwsh
        run: |
          $folder=Join-Path $env:RUNNER_TEMP "teste-backup-amzg"
          $zipFiles=@(Get-ChildItem $folder -Filter 'armazem-gratidao-completo-*.zip')
          if($zipFiles.Count -ne 1) { throw "Backup completo obrigatorio nao foi gerado" }
          Add-Type -AssemblyName System.IO.Compression
          $z=[System.IO.Compression.ZipFile]::OpenRead($zipFiles[0].FullName)
          try {
            $found=$z.GetEntry('Dados/armazem-gratidao.db')
            if(!$found -or $found.Length -lt 100) { throw "Arquivo SQLite ausente do backup completo" }
          } finally { $z.Dispose() }
      - name: Criar pacote de atualizacao ZIP (sem instalacao)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='novo-win8/bin/x64/Release'
          $temp=Join-Path $env:RUNNER_TEMP 'amzg-atualizacao'
          New-Item -ItemType Directory -Force "$temp/x64" | Out-Null
          foreach($name in @('ArmazemGratidaoNovo.exe','QRCoder.dll','System.Data.SQLite.dll','zxing.dll')){
            if(!(Test-Path "$root/$name")) { throw "Componente obrigatorio ausente: $name" }
            Copy-Item "$root/$name" "$temp/$name"
          }
          if(Test-Path "$root/ArmazemGratidaoNovo.exe.config") {
            Copy-Item "$root/ArmazemGratidaoNovo.exe.config" "$temp/ArmazemGratidaoNovo.exe.config"
          }
          Copy-Item "$root/x64/SQLite.Interop.dll" "$temp/x64/SQLite.Interop.dll"
          $zip='novo-win8/Armazem-Gratidao-Atualizacao.zip'
          Compress-Archive -Path "$temp/*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression
          $archive=[System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $exe=$archive.GetEntry('ArmazemGratidaoNovo.exe')
            if(!$exe -or $exe.Length -lt 10000) { throw "Executavel nao encontrado ou incompleto no ZIP" }
            $expected=@('ArmazemGratidaoNovo.exe','ArmazemGratidaoNovo.exe.config','QRCoder.dll','System.Data.SQLite.dll','zxing.dll','x64/SQLite.Interop.dll')
            foreach($entry in $archive.Entries) {
              if($entry.Name -and $entry.FullName.Replace('\\','/') -notin $expected) {
                throw "Arquivo nao autorizado no pacote: $($entry.FullName)"
              }
            }
          } finally { $archive.Dispose() }
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Pacote ZIP pronto: $zip"
          Write-Host "SHA-256: $hash"
      - name: Guardar pacote de atualizacao sem instalador
        uses: actions/upload-artifact@v4
        with:
          name: Armazem-Gratidao-Atualizacao-ZIP
          path: novo-win8/Armazem-Gratidao-Atualizacao.zip
          if-no-files-found: error
      - name: Publicar ZIP no Releases (sem novo Setup)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="amzg-novo-win8-build-${{ github.run_number }}"
          gh release create $tag "novo-win8/Armazem-Gratidao-Atualizacao.zip" --title "Armazem Gratidao - atualizacao ${{ github.run_number }}" --notes "Pacote automatico ZIP verificado por SHA-256, aplicado pelo AtualizadorGratidao.exe instalado junto do unico instalador completo. Antes de atualizar, o programa verifica o banco e salva backup completo dos dados e configuracoes. Nao exige reinstalar." --target "${{ github.sha }}" --latest
          if($LASTEXITCODE -ne 0){ throw "Falha ao publicar a atualizacao" }
      - name: Atualizar somente o manifesto ZIP (preservar instalador legado)
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $build=[int]'${{ github.run_number }}'
          $file='novo-win8/Armazem-Gratidao-Atualizacao.zip'
          $name='Armazem-Gratidao-Atualizacao.zip'
          $tag="amzg-novo-win8-build-$build"
          $digest=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=[ordered]@{
            build=$build
            tag=$tag
            asset=$name
            url="https://github.com/giliotiesg-pixel/erp-gratidao-updates/releases/download/$tag/$name"
            sha256=$digest
          } | ConvertTo-Json -Depth 3 -Compress
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($manifest))
          $path='atualizacao-novo-win8-pacote.json'
          $payload=@{message="atualizacao ${build}: publicar pacote ZIP [skip ci]";branch='main';content=$content}
          $oldSha=& gh api "repos/giliotiesg-pixel/erp-gratidao-updates/contents/$path" --jq '.sha' 2>$null
          if($LASTEXITCODE -eq 0 -and ![string]::IsNullOrWhiteSpace($oldSha)){$payload.sha=$oldSha.Trim()}
          $payload | ConvertTo-Json -Compress | gh api --method PUT "repos/giliotiesg-pixel/erp-gratidao-updates/contents/$path" --input -
          if($LASTEXITCODE -ne 0){throw "Manifesto ZIP nao publicado"}
