name: Publicar somente atualizador seguro 592
on:
  push:
    branches:
      - fix/amzg-bloquear-downgrade-build592
    paths:
      - '.github/workflows/publicar-atualizador-seguro-592.yml'
jobs:
  publicar:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exigir sucesso do teste antirretrocesso
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=gh run view 42385349373 --repo giliotiesg-pixel/erp-gratidao-updates --json conclusion,status --jq '.conclusion'
          if($LASTEXITCODE -ne 0 -or $out.Trim() -ne 'success'){
            throw "Build 592 nao validada. CI: $out"
          }
          Write-Host 'Build 592 com teste de bloqueio de 582 APROVADO.'
      - name: Baixar o EXE testado, sem distribuir instalador
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh run download 42385349373 --repo giliotiesg-pixel/erp-gratidao-updates --name Armazem-Gratidao-Unico-build-592 --dir pacote
          if($LASTEXITCODE -ne 0){throw 'Artefato nao disponivel.'}
          $updater='pacote/AtualizadorGratidao.exe'
          if(!(Test-Path $updater)){throw 'Executavel independente ausente.'}
          if((Get-Item $updater).Length -lt 30000){throw 'Atualizador incompleto.'}
          $hash=(Get-FileHash $updater -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='1.0.0.592'
          $fileVersion=(Get-Item $updater).VersionInfo.FileVersion
          if($fileVersion -ne $expected){throw "Arquivo tem versao $fileVersion em vez de $expected"}
          "AtualizadorGratidao.exe SHA256: $hash" |
            Set-Content 'pacote/ATUALIZADOR-SHA256.txt' -Encoding ascii
          Write-Host "SHA256 do EXE: $hash"
      - name: Publicar prerelease com APENAS atualizador e hash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tag='amzg-seguranca-atualizador-592'
          $notes=@'
          Atualizador visual de seguranca (Windows 8 x64, .NET 4.5).
          Corrige a falha que deixava o aplicativo oferecer a antiga build 582.
          Este arquivo recusa qualquer versao menor ou igual a instalada ANTES
          de copiar o executavel e os arquivos do programa.

          INSTALACAO SEM REINSTALAR: feche o Armazem Gratidao, copie
          SOMENTE AtualizadorGratidao.exe para a mesma pasta do arquivo
          ArmazemGratidaoNovo.exe (normalmente C:\ERP-Gratidao\).
          Preserve todos os dados e backups. Nao execute o EXE isoladamente:
          o atualizador e chamado automaticamente pelo programa.
          O aviso da versao 582 pode continuar aparecendo na aplicacao antiga;
          clique em NAO. A protecao ja nao deixa instalar por engano.

          Nota: o manifesto oficial permanece em build 582.
          Testado no CI Windows moderno, ainda nao validado em Windows 8 fisico.
          '@
          $params=@('release','create',$tag,'pacote/AtualizadorGratidao.exe',
            'pacote/ATUALIZADOR-SHA256.txt','--repo','giliotiesg-pixel/erp-gratidao-updates',
            '--target','fix/amzg-bloquear-downgrade-build592',
            '--title','Armazem Gratidao - Somente Atualizador Seguro 592',
            '--notes',$notes,'--prerelease')
          gh @params
          if($LASTEXITCODE -ne 0){throw 'Falha ao publicar o atualizador.'}
          gh release view $tag --repo giliotiesg-pixel/erp-gratidao-updates --json url,name,isPrerelease,assets
          if($LASTEXITCODE -ne 0){throw 'Release nao acessivel.'}
